<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樂譜圖片辨識與播放器</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#f5f7fb;color:#18253c;margin:0}main{max-width:920px;margin:30px auto;padding:0 18px}section{background:white;border:1px solid #e1e5ed;border-radius:16px;padding:20px;margin:16px 0}h1{margin-bottom:6px}p,small{color:#526078}button,input,select,textarea{font:inherit}button{background:#2357b8;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;margin:3px}button:disabled{opacity:.5}input[type=file]{max-width:100%}img{max-width:100%;max-height:400px;object-fit:contain;border-radius:8px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}textarea{width:100%;min-height:230px;box-sizing:border-box;font-family:ui-monospace,monospace;font-size:13px}#status{white-space:pre-wrap;color:#2a4e7e}label{display:inline-flex;align-items:center;gap:6px}input[type=number]{width:76px}code{background:#eef1f6;padding:2px 5px;border-radius:4px}</style></head><body><main><h1>🎼 樂譜圖片辨識與播放器</h1><p>免安裝 Python。上傳樂譜圖片，使用雲端 AI 辨識音符，校正後直接在瀏覽器播放。</p><section><h2>① 上傳樂譜</h2><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><p><img id="preview" alt="樂譜預覽" hidden></p><button id="recognize">AI 辨識圖片</button><span id="status" role="status">請先選擇圖片。</span><p><small>AI 辨識需要網站管理者在 Vercel 設定 OPENAI_API_KEY。手寫譜、複雜和聲與節奏可能辨識錯誤，請核對下方音符。</small></p></section><section><h2>② 編輯辨識結果</h2><p>每個聲部使用 <code>notes</code> 陣列；<code>pitch</code> 為 MIDI 音高（中央 C = 60），<code>start</code> 與 <code>duration</code> 為四分音符拍數。休止符不必建立音符。</p><textarea id="json" spellcheck="false" aria-label="音符 JSON 編輯器"></textarea><div class="controls"><button id="demo">載入示範</button><button id="validate">檢查資料</button><button id="export">匯出 JSON</button><label>匯入 JSON <input id="import" type="file" accept="application/json,.json"></label></div></section><section><h2>③ 播放</h2><div class="controls"><label>速度 BPM <input id="bpm" type="number" min="30" max="240" value="100"></label><button id="play">▶ 播放</button><button id="stop">■ 停止</button><label><input id="loop" type="checkbox">循環</label></div><p id="playstatus">尚未播放</p></section><p><small>僅在取得授權或具合法使用權的情況下上傳樂譜圖片。圖片會傳送至網站的 AI 辨識服務；請勿上傳敏感內容。</small></p></main><script>
const $=id=>document.getElementById(id);let imageData='',ctx=null,active=[],timers=[],playing=false,session=0;
const demo={title:'示範：雙聲部',voices:[{name:'高音譜表',notes:[{pitch:72,start:0,duration:1},{pitch:74,start:1,duration:1},{pitch:76,start:2,duration:1},{pitch:77,start:3,duration:1}]},{name:'中音譜表',notes:[{pitch:60,start:0,duration:2},{pitch:55,start:2,duration:2}]}]};
$('json').value=JSON.stringify(demo,null,2);
$('file').addEventListener('change',async e=>{const f=e.target.files[0];imageData='';if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){alert('請上傳 PNG、JPG 或 WebP');return;}if(f.size>8*1024*1024){alert('圖片不可超過 8MB');return;}const r=new FileReader();r.onload=()=>{imageData=r.result;$('preview').src=imageData;$('preview').hidden=false;$('status').textContent='圖片已載入，可以開始辨識。'};r.readAsDataURL(f)});
function checked(){const d=JSON.parse($('json').value);if(!d||!Array.isArray(d.voices)||d.voices.length<1)throw Error('必須包含 voices 陣列');let count=0;for(const v of d.voices){if(!Array.isArray(v.notes))throw Error('每個聲部必須包含 notes 陣列');for(const n of v.notes){if(!Number.isInteger(n.pitch)||n.pitch<0||n.pitch>127||!Number.isFinite(n.start)||n.start<0||!Number.isFinite(n.duration)||n.duration<=0||n.duration>64)throw Error('音符 pitch/start/duration 格式有誤');count++;}}if(count>2000)throw Error('音符過多');return d;}
$('validate').onclick=()=>{try{const d=checked();alert('資料正確，共 '+d.voices.reduce((s,v)=>s+v.notes.length,0)+' 個音符')}catch(e){alert(e.message)}};
$('demo').onclick=()=>{$('json').value=JSON.stringify(demo,null,2)};
$('recognize').onclick=async()=>{if(!imageData){alert('請先上傳圖片');return}const b=$('recognize');b.disabled=true;$('status').textContent='AI 辨識中，請稍候…';try{const r=await fetch('/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imageData})});const result=await r.json();if(!r.ok)throw Error(result.error||'辨識失敗');$('json').value=JSON.stringify(result,null,2);checked();$('status').textContent='辨識完成！請檢查音高與節奏後播放。'}catch(e){$('status').textContent='辨識失敗：'+e.message+'。仍可使用示範音符或匯入 JSON。'}finally{b.disabled=false}};
$('export').onclick=()=>{try{const data=checked();const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='score-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert(e.message)}};
$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('json').value=await f.text();try{checked();alert('匯入成功')}catch(err){alert('匯入資料有誤：'+err.message)}};
function stop(){session++;playing=false;timers.forEach(clearTimeout);timers=[];active.forEach(x=>{try{x.osc.stop()}catch(e){}try{x.osc.disconnect()}catch(e){}});active=[];$('playstatus').textContent='已停止';}
$('stop').onclick=stop;
function play(){stop();let d;try{d=checked()}catch(e){alert(e.message);return}const bpm=Number($('bpm').value);if(!Number.isFinite(bpm)||bpm<30||bpm>240){alert('速度請設定在 30–240 BPM');return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC){alert('瀏覽器不支援 Web Audio');return}ctx=ctx||new AC();ctx.resume();const notes=d.voices.flatMap(v=>v.notes);if(!notes.length){alert('沒有音符');return}const beat=60/bpm,now=ctx.currentTime+.08,mySession=++session;playing=true;let end=0;notes.forEach(n=>{const start=now+n.start*beat,dur=n.duration*beat;end=Math.max(end,n.start+n.duration);const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=440*Math.pow(2,(n.pitch-69)/12);gain.gain.setValueAtTime(.0001,start);gain.gain.linearRampToValueAtTime(.12/Math.sqrt(Math.max(1,d.voices.length)),start+.02);gain.gain.setValueAtTime(.12/Math.sqrt(Math.max(1,d.voices.length)),Math.max(start+.021,start+dur-.06));gain.gain.exponentialRampToValueAtTime(.0001,start+dur);osc.connect(gain).connect(ctx.destination);osc.start(start);osc.stop(start+dur+.03);active.push({osc});osc.onended=()=>{osc.disconnect();gain.disconnect()}});$('playstatus').textContent='播放中…';timers.push(setTimeout(()=>{if(mySession!==session)return;playing=false;$('playstatus').textContent='播放完成';if($('loop').checked)play()},(end*beat+.18)*1000))}
$('play').onclick=play;
</script></body></html>
